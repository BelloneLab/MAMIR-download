name: Ephemeral Windows bootstrap diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Check out the private immutable installer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BelloneLab/MAMIR
          ref: v0.1.6
          ssh-key: ${{ secrets.MAMIR_READ_KEY }}
          persist-credentials: false
          lfs: false
          path: mamir
      - name: Probe the exact verified bootstrap
        shell: pwsh
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "mamir-windows-uv-probe.log"
          & {
            $ErrorActionPreference = "Stop"
            $Archive = Join-Path $env:RUNNER_TEMP "uv-x86_64-pc-windows-msvc.zip"
            $Extracted = Join-Path $env:RUNNER_TEMP "uv-extracted"
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://github.com/astral-sh/uv/releases/download/0.12.5/uv-x86_64-pc-windows-msvc.zip" `
              -OutFile $Archive
            $ArchiveHash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLowerInvariant()
            if ($ArchiveHash -ne "4c4d49d8738847d9b71ba319e49a5688c93eac0fe6204b1df24e98528dddf39a") {
              throw "archive hash mismatch"
            }
            Expand-Archive -LiteralPath $Archive -DestinationPath $Extracted
            $Source = (Get-ChildItem $Extracted -Recurse -Filter uv.exe -File).FullName
            $DestinationDir = Join-Path $env:RUNNER_TEMP "MAMIR Studio Test\tools\uv"
            New-Item -ItemType Directory -Path $DestinationDir -Force | Out-Null
            $Destination = Join-Path $DestinationDir "uv.exe"
            Copy-Item -LiteralPath $Source -Destination $Destination -Force
            Unblock-File -LiteralPath $Destination -ErrorAction SilentlyContinue
            $ExecutableHash = (Get-FileHash -Algorithm SHA256 $Destination).Hash.ToLowerInvariant()
            if ($ExecutableHash -ne "8da6cedef60c27ac997ebf400fbfc6d373c5b0a7ae6a299b9d52be7fe63723fb") {
              throw "executable hash mismatch"
            }

            $OriginalPath = $env:PATH
            $env:PATH = @(
              (Join-Path $env:SystemRoot "System32"),
              (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
            ) -join ";"
            $env:UV_OFFLINE = "1"
            $env:UV_PYTHON_DOWNLOADS = "never"
            $env:UV_NO_MANAGED_PYTHON = "1"
            try {
              Write-Output "powershell=$($PSVersionTable.PSVersion)"
              Write-Output "path=$Destination"
              Write-Output "size=$((Get-Item -LiteralPath $Destination).Length)"
              Write-Output "sha256=$ExecutableHash"
              $VersionOutput = @(& $Destination --version 2>&1)
              $ExitCode = $LASTEXITCODE
              Write-Output "invocation_exit=$ExitCode"
              Write-Output "invocation_count=$($VersionOutput.Count)"
              for ($Index = 0; $Index -lt $VersionOutput.Count; $Index++) {
                $Text = [string]$VersionOutput[$Index]
                Write-Output "invocation_output[$Index]=$($Text.Replace("`r", "<CR>").Replace("`n", "<LF>"))"
              }
              $Pattern = "^uv " + [regex]::Escape("0.12.5") +
                " (\([A-Za-z0-9_.-]+\))$"
              $CompatiblePattern = "^uv " + [regex]::Escape("0.12.5") +
                "( \([A-Za-z0-9_.:+-]+( [A-Za-z0-9_.:+-]+)*\))?$"
              Write-Output "strict_match=$(([string]$VersionOutput[0]).Trim() -cmatch $Pattern)"
              Write-Output "compatible_match=$(([string]$VersionOutput[0]).Trim() -cmatch $CompatiblePattern)"

              $Process = New-Object System.Diagnostics.Process
              $Process.StartInfo.FileName = $Destination
              $Process.StartInfo.Arguments = "--version"
              $Process.StartInfo.UseShellExecute = $false
              $Process.StartInfo.RedirectStandardOutput = $true
              $Process.StartInfo.RedirectStandardError = $true
              $null = $Process.Start()
              $Stdout = $Process.StandardOutput.ReadToEnd().Trim()
              $Stderr = $Process.StandardError.ReadToEnd().Trim()
              $Process.WaitForExit()
              Write-Output "process_exit=$($Process.ExitCode)"
              Write-Output "process_stdout=$Stdout"
              Write-Output "process_stderr=$Stderr"
              if ($ExitCode -ne 0 -or $VersionOutput.Count -ne 1 -or
                  -not (([string]$VersionOutput[0]).Trim() -cmatch $CompatiblePattern) -or
                  $Process.ExitCode -ne 0) {
                throw "verified bootstrap execution probe failed"
              }

              Remove-Item Env:UV_OFFLINE -ErrorAction SilentlyContinue
              Remove-Item Env:UV_NO_MANAGED_PYTHON -ErrorAction SilentlyContinue
              $env:UV_PYTHON_DOWNLOADS = "automatic"
              $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "MAMIR Studio Test\tools\python"
              $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "mamir-uv-cache"
              $Venv = Join-Path $env:RUNNER_TEMP "MAMIR Studio Test\runtime"
              $VenvPython = Join-Path $Venv "Scripts\python.exe"
              $Constraints = Join-Path $env:RUNNER_TEMP "mamir-install-constraints.txt"
              Set-Content -LiteralPath $Constraints -Value "numpy>=1.26,<2" -Encoding Ascii

              Write-Output "==> provision exact managed Python"
              $PythonOutput = @(& $Destination python install --managed-python `
                --no-config --no-bin --no-registry 3.12.14 2>&1)
              $PythonExit = $LASTEXITCODE
              $PythonOutput | ForEach-Object { Write-Output "python_install: $_" }
              Write-Output "python_install_exit=$PythonExit"
              if ($PythonExit -ne 0) { throw "managed Python probe failed" }

              $VenvOutput = @(& $Destination venv --seed --managed-python `
                --no-python-downloads --no-config --python 3.12.14 $Venv 2>&1)
              $VenvExit = $LASTEXITCODE
              $VenvOutput | ForEach-Object { Write-Output "venv: $_" }
              Write-Output "venv_exit=$VenvExit"
              if ($VenvExit -ne 0) { throw "managed venv probe failed" }

              Write-Output "==> install exact Windows CPU Torch pair"
              $TorchOutput = @(& $Destination --verbose pip install `
                --python $VenvPython --torch-backend cpu --constraints $Constraints `
                --reinstall-package torch --reinstall-package torchvision `
                "torch==2.8.0" "torchvision==0.23.0" 2>&1)
              $TorchExit = $LASTEXITCODE
              $TorchOutput | ForEach-Object { Write-Output "torch_install: $_" }
              Write-Output "torch_install_exit=$TorchExit"
              if ($TorchExit -ne 0) { throw "CPU Torch install probe failed" }
              & $VenvPython -c `
                "import torch,torchvision; print(torch.__version__, torchvision.__version__); print(torch.ones(4).mul_(2).sum().item())"
              if ($LASTEXITCODE -ne 0) { throw "CPU Torch execution probe failed" }

              Write-Output "==> Windows PowerShell 5.1 exact Torch helper"
              $Ps51Probe = Join-Path $env:RUNNER_TEMP "mamir-ps51-torch-helper.ps1"
          @'
          param(
            [Parameter(Mandatory = $true)][string]$Library,
            [Parameter(Mandatory = $true)][string]$Uv,
            [Parameter(Mandatory = $true)][string]$Python,
            [Parameter(Mandatory = $true)][string]$Constraints,
            [Parameter(Mandatory = $true)][string]$TorchProbe
          )
          $ErrorActionPreference = "Stop"
          . $Library
          Remove-Item Env:UV_OFFLINE -ErrorAction SilentlyContinue
          Remove-Item Env:UV_NO_MANAGED_PYTHON -ErrorAction SilentlyContinue
          $env:UV_PYTHON_DOWNLOADS = "automatic"
          $InstallExit = Invoke-MamirNativeToHost -Executable $Uv -Arguments @(
            "pip", "install", "--python", $Python, "--torch-backend", "cpu",
            "--constraints", $Constraints, "--reinstall-package", "torch",
            "--reinstall-package", "torchvision", "torch==2.8.0",
            "torchvision==0.23.0"
          )
          Write-Output "ps51_helper_install_exit=$InstallExit"
          $VerifyExit = Invoke-MamirNativeToHost -Executable $Python -Arguments @(
            $TorchProbe, "verify", "--backend", "cpu"
          )
          Write-Output "ps51_helper_verify_exit=$VerifyExit"
          if ($InstallExit -ne 0 -or $VerifyExit -ne 0) {
            throw "Windows PowerShell 5.1 exact Torch helper failed"
          }
          '@ | Set-Content -LiteralPath $Ps51Probe -Encoding UTF8
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File $Ps51Probe `
                -Library (Resolve-Path "mamir\install\windows-installer-lib.ps1").Path `
                -Uv $Destination -Python $VenvPython -Constraints $Constraints `
                -TorchProbe (Resolve-Path "mamir\install\torch_backend.py").Path
              if ($LASTEXITCODE -ne 0) {
                throw "Windows PowerShell 5.1 exact Torch helper probe failed"
              }

              Write-Output "==> Windows PowerShell 5.1 installer primitives"
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File mamir\install\test-windows-installer.ps1 -SkipUv
              if ($LASTEXITCODE -ne 0) {
                throw "Windows PowerShell 5.1 installer primitive probe failed"
              }
            } finally {
              $env:PATH = $OriginalPath
            }
          } *> $Log
      - name: Encrypt the diagnostic
        if: always()
        shell: bash
        env:
          MAMIR_DIAGNOSTIC_PASSWORD: ${{ secrets.MAMIR_DIAGNOSTIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MAMIR_DIAGNOSTIC_PASSWORD}"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -pass env:MAMIR_DIAGNOSTIC_PASSWORD \
            -in "${RUNNER_TEMP}/mamir-windows-uv-probe.log" \
            -out "${RUNNER_TEMP}/mamir-windows-uv-probe.log.enc"
      - name: Transfer the encrypted diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mamir-windows-uv-probe-encrypted
          path: ${{ runner.temp }}/mamir-windows-uv-probe.log.enc
          if-no-files-found: error
          retention-days: 1
