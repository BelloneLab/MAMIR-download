name: MAMIR v0.1.10 ephemeral private native gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} native installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the private immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BelloneLab/MAMIR
          ref: v0.1.10
          ssh-key: ${{ secrets.MAMIR_READ_KEY }}
          persist-credentials: false
          lfs: true
          path: mamir
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate the exact release identity
        shell: bash
        working-directory: mamir
        env:
          MAMIR_BUILD_REF: v0.1.10
          MAMIR_BUILD_VERSION: 0.1.10
        run: |
          set -euo pipefail
          [[ "${MAMIR_BUILD_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${MAMIR_BUILD_REF}" = "v${MAMIR_BUILD_VERSION}"
          test "$(git describe --tags --exact-match)" = "${MAMIR_BUILD_REF}"
          test "$(sed -n 's/^version: *//p' CITATION.cff)" = "${MAMIR_BUILD_VERSION}"
      - name: Build the verified private release bundle
        shell: bash
        working-directory: mamir
        env:
          MAMIR_BUILD_VERSION: 0.1.10
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade build
            mkdir -p release-wheels release-bundle release-assets
            python install/stage_bootstraps.py --output-dir release-bootstraps
            python -m build packages/mamir --outdir "$PWD/release-wheels"
            python -m build . --outdir "$PWD/release-wheels"
            python install/build_release_bundle.py \
              --wheel-dir release-wheels \
              --bootstrap-dir release-bootstraps \
              --output-dir release-bundle \
              --version "${MAMIR_BUILD_VERSION}" \
              --commit "$(git rev-parse HEAD)"
          } >"${RUNNER_TEMP}/mamir-build.log" 2>&1
      - name: Build, clean-install, and smoke-test Windows setup
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: mamir
        env:
          MAMIR_BUILD_VERSION: 0.1.10
        run: |
          $ErrorActionPreference = "Stop"
          $Log = Join-Path $env:RUNNER_TEMP "mamir-windows-native.log"
          $ShortcutTest = (Resolve-Path install\test-windows-shortcuts.ps1).Path
          & {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File install\test-windows-installer.ps1
            if ($LASTEXITCODE -ne 0) {
              throw "Windows RedirectionGuard bootstrap regression failed"
            }
            $null = [scriptblock]::Create((Get-Content release-bundle\install\install.ps1 -Raw))
            $null = [scriptblock]::Create((Get-Content release-bundle\install\windows-installer-lib.ps1 -Raw))
            $null = [scriptblock]::Create((Get-Content release-bundle\install\windows\run-runtime.ps1 -Raw))
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File release-bundle\install\install.ps1 -VerifyBundleOnly
            if ($LASTEXITCODE -ne 0) { throw "Windows bundle verification failed" }

            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $Iscc -PathType Leaf)) {
              throw "Inno Setup compiler was not installed"
            }
            $Bundle = (Resolve-Path release-bundle).Path
            $Output = (Resolve-Path release-assets).Path
            $Icon = (Resolve-Path release-bundle\studio\static\logo.ico).Path
            & $Iscc "/DBundleRoot=$Bundle" "/DBuildOutput=$Output" `
              "/DAppVersion=$env:MAMIR_BUILD_VERSION" "/DSourceIcon=$Icon" `
              release-bundle\install\windows\MAMIR.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

            $Installer = (Resolve-Path release-assets\MAMIR-Setup-Windows-x64.exe).Path
            $Destination = Join-Path $env:RUNNER_TEMP "MAMIR Studio Test"
            $SetupLog = Join-Path $env:RUNNER_TEMP "mamir-windows-setup.log"
            $SetupArgs = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=`"$Destination`"",
              "/LOG=`"$SetupLog`""
            )
            $OriginalPath = $env:PATH
            $env:PATH = @(
              (Join-Path $env:SystemRoot "System32"),
              (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
            ) -join ";"
            $env:UV_OFFLINE = "1"
            $env:UV_PYTHON_DOWNLOADS = "never"
            $env:UV_NO_MANAGED_PYTHON = "1"
            try {
              foreach ($Command in @("uv", "py", "python", "python3.12")) {
                if (Get-Command $Command -ErrorAction SilentlyContinue) {
                  throw "clean installer gate unexpectedly exposes $Command"
                }
              }
              $Setup = Start-Process -FilePath $Installer -ArgumentList $SetupArgs `
                -Wait -PassThru
            } finally {
              $env:PATH = $OriginalPath
            }
            if ($Setup.ExitCode -ne 0) {
              throw "compiled Windows setup returned $($Setup.ExitCode)"
            }
            $Mps = Join-Path $Destination "runtime\Scripts\mps.exe"
            $Ready = Join-Path $Destination (
              "logs\install-$env:MAMIR_BUILD_VERSION.ready"
            )
            $RuntimeLog = Join-Path $Destination (
              "logs\install-$env:MAMIR_BUILD_VERSION.log"
            )
            if (-not (Test-Path $Mps -PathType Leaf) -or
                -not (Test-Path $Ready -PathType Leaf)) {
              throw "compiled Windows setup did not create a verified ready runtime"
            }
            if (-not (Select-String -Path $RuntimeLog -SimpleMatch `
                "using the verified embedded uv bootstrap" -Quiet)) {
              throw "Windows setup did not use its embedded bootstrap"
            }
            $RuntimePython = Join-Path $Destination "runtime\Scripts\python.exe"
            $BasePrefix = [string](& $RuntimePython -c "import pathlib,sys; print(pathlib.Path(sys.base_prefix).resolve())")
            if ($LASTEXITCODE -ne 0) { throw "installed Python probe failed" }
            $ExpectedPythonRoot = [IO.Path]::GetFullPath(
              (Join-Path $Destination "tools\python")
            ).TrimEnd('\') + '\'
            if (-not [IO.Path]::GetFullPath($BasePrefix).StartsWith(
                $ExpectedPythonRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "managed Python escaped the selected MAMIR folder: $BasePrefix"
            }
            if ($BasePrefix -notmatch 'cpython-3\.12\.14-windows-x86_64-none' -or
                $BasePrefix -match 'cpython-3\.12-windows-x86_64-none') {
              throw "installed runtime did not use the direct patch-versioned Python payload"
            }
            & $RuntimePython -c "import sys; assert sys.version_info[:3] == (3, 12, 14)"
            if ($LASTEXITCODE -ne 0) { throw "installed Python version is not pinned" }
            & $Mps --help
            if ($LASTEXITCODE -ne 0) { throw "installed Windows launcher smoke test failed" }
            $RuntimeScripts = Split-Path -Parent $Mps
            $ShortcutPath = $env:PATH
            try {
              $env:PATH = "$RuntimeScripts;$ShortcutPath"
              & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
                -File $ShortcutTest
              if ($LASTEXITCODE -ne 0) {
                throw "installed Windows shortcut acceptance test failed"
              }
            } finally {
              $env:PATH = $ShortcutPath
            }
            $Hash = (Get-FileHash -Algorithm SHA256 $Installer).Hash.ToLowerInvariant()
            "$Hash  MAMIR-Setup-Windows-x64.exe" | Out-File `
              "$Installer.sha256" -Encoding ascii
          } *> $Log
      - name: Build, clean-install, and smoke-test macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: mamir
        env:
          MAMIR_BUILD_VERSION: 0.1.10
        run: |
          set -euo pipefail
          {
            bash release-bundle/install/install.sh --verify-bundle-only
            mkdir -p release-stage
            python release-bundle/install/stage_native_installer.py macos \
              --root "$PWD/release-bundle" --bundle "$PWD/release-bundle" \
              --output release-stage \
              --version "${MAMIR_BUILD_VERSION}"
            dmg="$PWD/release-assets/MAMIR-Installer-macOS-universal.dmg"
            hdiutil create -volname "MAMIR Installer" \
              -srcfolder "$PWD/release-stage/MAMIR Installer.app" \
              -ov -format UDZO "$dmg"
            hdiutil verify "$dmg"
            mount="${RUNNER_TEMP}/mamir-installer-volume"
            install_root="${RUNNER_TEMP}/mamir-installed"
            mkdir -p "$mount"
            hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse
            trap 'hdiutil detach "$mount"' EXIT
            bundle="$mount/MAMIR Installer.app/Contents/Resources/bundle"
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never UV_NO_MANAGED_PYTHON=1 \
              MAMIR_INSTALL_DIR="$install_root" MAMIR_LAUNCH_AFTER_INSTALL=0 \
              bash "$bundle/install/release-launcher.sh" "$bundle"
            grep -F "using the verified embedded uv bootstrap" \
              "$install_root"/logs/install-*.log
            "$install_root/runtime/bin/python" -c \
              'import sys; assert sys.version_info[:3] == (3, 12, 14)'
            base_prefix="$("$install_root/runtime/bin/python" -c \
              'import pathlib,sys; print(pathlib.Path(sys.base_prefix).resolve())')"
            case "$base_prefix" in
              "$install_root/tools/python"/*) ;;
              *) echo "managed Python escaped the selected folder: $base_prefix" >&2; exit 1 ;;
            esac
            "$install_root/runtime/bin/mps" --help
            hdiutil detach "$mount"
            trap - EXIT
            shasum -a 256 "$dmg" | sed 's#  .*/#  #' >"$dmg.sha256"
          } >"${RUNNER_TEMP}/mamir-macos-native.log" 2>&1
      - name: Build, clean-install, and smoke-test Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: mamir
        env:
          GH_TOKEN: ${{ github.token }}
          MAMIR_BUILD_VERSION: 0.1.10
        run: |
          set -euo pipefail
          {
            bash release-bundle/install/install.sh --verify-bundle-only
            mkdir -p release-stage release-deb-stage appimage-tools
            python release-bundle/install/stage_native_installer.py linux \
              --root "$PWD/release-bundle" --bundle "$PWD/release-bundle" \
              --output release-stage \
              --version "${MAMIR_BUILD_VERSION}"
            python release-bundle/install/stage_native_installer.py linux-deb \
              --root "$PWD/release-bundle" --bundle "$PWD/release-bundle" \
              --output release-deb-stage \
              --version "${MAMIR_BUILD_VERSION}"

            gh api -H 'Accept: application/octet-stream' \
              /repos/AppImage/appimagetool/releases/assets/324406882 \
              >appimage-tools/appimagetool.AppImage
            echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimage-tools/appimagetool.AppImage' \
              | sha256sum --check --strict
            gh api -H 'Accept: application/octet-stream' \
              /repos/AppImage/type2-runtime/releases/assets/456065460 \
              >appimage-tools/runtime-x86_64
            echo '1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  appimage-tools/runtime-x86_64' \
              | sha256sum --check --strict
            chmod +x appimage-tools/appimagetool.AppImage appimage-tools/runtime-x86_64
            (
              cd appimage-tools
              ./appimagetool.AppImage --appimage-extract >/dev/null
              VERSION="${MAMIR_BUILD_VERSION}" ARCH=x86_64 ./squashfs-root/AppRun \
                --runtime-file "$PWD/runtime-x86_64" \
                "$GITHUB_WORKSPACE/mamir/release-stage/MAMIR-Installer.AppDir" \
                "$GITHUB_WORKSPACE/mamir/release-assets/MAMIR-Installer-Linux-x86_64.AppImage"
            )
            appimage="$PWD/release-assets/MAMIR-Installer-Linux-x86_64.AppImage"
            chmod +x "$appimage"
            "$appimage" --appimage-version

            package_root="$PWD/release-deb-stage/MAMIR-Installer-Debian-amd64"
            sudo apt-get update -qq
            sudo apt-get install -y desktop-file-utils
            desktop-file-validate \
              "$package_root/usr/share/applications/ch.unige.bellonelab.mamir.installer.desktop"
            dpkg-deb --root-owner-group -Zgzip -z1 --build "$package_root" \
              "$PWD/release-assets/MAMIR-Installer-Ubuntu-Debian-amd64.deb"
            deb="$PWD/release-assets/MAMIR-Installer-Ubuntu-Debian-amd64.deb"
            sudo apt-get install -y "$deb"
            install_root="${RUNNER_TEMP}/mamir-installed"
            bundle="/usr/share/mamir-installer/bundle"
            UV_OFFLINE=1 UV_PYTHON_DOWNLOADS=never UV_NO_MANAGED_PYTHON=1 \
              MAMIR_INSTALL_DIR="$install_root" MAMIR_LAUNCH_AFTER_INSTALL=0 \
              bash "$bundle/install/release-launcher.sh" "$bundle"
            grep -F "using the verified embedded uv bootstrap" \
              "$install_root"/logs/install-*.log
            "$install_root/runtime/bin/python" -c \
              'import sys; assert sys.version_info[:3] == (3, 12, 14)'
            base_prefix="$("$install_root/runtime/bin/python" -c \
              'import pathlib,sys; print(pathlib.Path(sys.base_prefix).resolve())')"
            case "$base_prefix" in
              "$install_root/tools/python"/*) ;;
              *) echo "managed Python escaped the selected folder: $base_prefix" >&2; exit 1 ;;
            esac
            "$install_root/runtime/bin/mps" --help

            for asset in "$appimage" "$deb"; do
              sha256sum "$asset" | sed 's#  .*/#  #' >"$asset.sha256"
            done
          } >"${RUNNER_TEMP}/mamir-linux-native.log" 2>&1
      - name: Reject fatal native installer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "$RUNNER_TEMP" -type f -name '*.log' -print -quit)"
          if find "$RUNNER_TEMP" -type f -name '*.log' -exec grep -E -n -i \
            'CUDA_ERROR_INVALID_CONTEXT|MAMIR runtime installation failed|Unable to execute file|CreateProcess failed|TerminatingError|Traceback \(most recent call last\)' \
            {} +; then
            echo "fatal marker found in native installer diagnostics" >&2
            exit 1
          fi
      - name: Encrypt installers, checksums, and private diagnostics
        if: always()
        shell: bash
        env:
          MAMIR_ARTIFACT_PASSWORD: ${{ secrets.MAMIR_DIAGNOSTIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MAMIR_ARTIFACT_PASSWORD}"
          encrypted="${RUNNER_TEMP}/mamir-encrypted"
          mkdir -p "$encrypted"
          inputs=()
          while IFS= read -r -d '' file; do
            inputs+=("$file")
          done < <(find "$GITHUB_WORKSPACE/mamir/release-assets" -maxdepth 1 \
            -type f \( -name 'MAMIR-*' -o -name 'MAMIR-*.sha256' \) -print0 2>/dev/null)
          while IFS= read -r -d '' file; do
            inputs+=("$file")
          done < <(find "$RUNNER_TEMP" -maxdepth 1 -type f \
            -name 'mamir-*.log' -print0 2>/dev/null)
          if [ "${{ matrix.platform }}" = windows ]; then
            while IFS= read -r -d '' file; do
              inputs+=("$file")
            done < <(find "$RUNNER_TEMP/MAMIR Studio Test/logs" -maxdepth 1 \
              -type f -name 'install-*' -print0 2>/dev/null)
          fi
          test "${#inputs[@]}" -gt 0
          index=0
          for input in "${inputs[@]}"; do
            index=$((index + 1))
            output="$encrypted/$(printf '%02d' "$index")-$(basename "$input").enc"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
              -pass env:MAMIR_ARTIFACT_PASSWORD -in "$input" -out "$output"
          done
      - name: Transfer encrypted outputs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mamir-0.1.10-${{ matrix.platform }}-encrypted
          path: ${{ runner.temp }}/mamir-encrypted/*.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
