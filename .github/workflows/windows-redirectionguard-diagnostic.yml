name: Ephemeral Windows RedirectionGuard diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Check out the exact private installer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BelloneLab/MAMIR
          ref: f8b418f9499f5f95e8303d785d6b24147eed1bd9
          ssh-key: ${{ secrets.MAMIR_READ_KEY }}
          persist-credentials: false
          lfs: false
          path: mamir
      - name: Exercise clean and blocked-junction bootstraps in Windows PowerShell 5.1
        shell: pwsh
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "mamir-redirectionguard.log"
          & {
            $ErrorActionPreference = "Stop"
            foreach ($Relative in @(
              "install\install.ps1",
              "install\windows-installer-lib.ps1",
              "install\test-windows-installer.ps1"
            )) {
              $Path = Join-Path "mamir" $Relative
              $null = [scriptblock]::Create((Get-Content -LiteralPath $Path -Raw))
            }
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File mamir\install\test-windows-installer.ps1
            if ($LASTEXITCODE -ne 0) {
              throw "Windows PowerShell 5.1 RedirectionGuard regression failed"
            }
          } *> $Log
          Write-Host "PASS - exact private Windows RedirectionGuard regression"
      - name: Encrypt the diagnostic
        if: always()
        shell: bash
        env:
          MAMIR_DIAGNOSTIC_PASSWORD: ${{ secrets.MAMIR_DIAGNOSTIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MAMIR_DIAGNOSTIC_PASSWORD}"
          test -f "${RUNNER_TEMP}/mamir-redirectionguard.log"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -pass env:MAMIR_DIAGNOSTIC_PASSWORD \
            -in "${RUNNER_TEMP}/mamir-redirectionguard.log" \
            -out "${RUNNER_TEMP}/mamir-redirectionguard.log.enc"
      - name: Transfer only the encrypted diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mamir-redirectionguard-encrypted
          path: ${{ runner.temp }}/mamir-redirectionguard.log.enc
          if-no-files-found: error
          retention-days: 1
