name: Ephemeral private native build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact private MAMIR tag or commit
        required: true
        type: string
      version:
        description: Exact MAMIR release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} native installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the private immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BelloneLab/MAMIR
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.MAMIR_READ_KEY }}
          persist-credentials: false
          lfs: true
          path: mamir
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Build and verify the release bundle
        shell: bash
        working-directory: mamir
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          mkdir -p release-wheels release-bundle release-assets
          python -m build packages/mamir --outdir "$PWD/release-wheels"
          python -m build . --outdir "$PWD/release-wheels"
          python install/build_release_bundle.py \
            --wheel-dir release-wheels \
            --output-dir release-bundle \
            --version "${{ inputs.version }}" \
            --commit "$(git rev-parse HEAD)"
      - name: Verify the Windows release payload
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: mamir
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File release-bundle\install\install.ps1 -VerifyBundleOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle verification failed" }
      - name: Verify the POSIX release payload
        if: matrix.platform != 'windows'
        shell: bash
        working-directory: mamir
        run: |
          set -euo pipefail
          bash release-bundle/install/install.sh --verify-bundle-only
      - name: Compile the Windows setup executable
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: mamir
        run: |
          choco install innosetup --no-progress -y
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) { throw "Inno Setup compiler was not installed" }
          $Bundle = (Resolve-Path release-bundle).Path
          $Output = (Resolve-Path release-assets).Path
          $Icon = (Resolve-Path studio\static\logo.ico).Path
          & $Iscc "/DBundleRoot=$Bundle" "/DBuildOutput=$Output" `
            "/DAppVersion=${{ inputs.version }}" "/DSourceIcon=$Icon" `
            install\windows\MAMIR.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (-not (Test-Path release-assets\MAMIR-Setup-Windows-x64.exe)) {
            throw "Windows installer asset is missing"
          }
      - name: Build the universal macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: mamir
        run: |
          set -euo pipefail
          mkdir -p release-stage
          python install/stage_native_installer.py macos \
            --bundle release-bundle --output release-stage \
            --version "${{ inputs.version }}"
          hdiutil create -volname "MAMIR Installer" \
            -srcfolder "$PWD/release-stage/MAMIR Installer.app" \
            -ov -format UDZO \
            "$PWD/release-assets/MAMIR-Installer-macOS-universal.dmg"
          hdiutil verify "$PWD/release-assets/MAMIR-Installer-macOS-universal.dmg"
      - name: Build the Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: mamir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-stage appimage-tools
          python install/stage_native_installer.py linux \
            --bundle release-bundle --output release-stage \
            --version "${{ inputs.version }}"
          gh api -H 'Accept: application/octet-stream' \
            /repos/AppImage/appimagetool/releases/assets/324406882 \
            >appimage-tools/appimagetool.AppImage
          echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimage-tools/appimagetool.AppImage' \
            | sha256sum --check --strict
          gh api -H 'Accept: application/octet-stream' \
            /repos/AppImage/type2-runtime/releases/assets/456065460 \
            >appimage-tools/runtime-x86_64
          echo '1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  appimage-tools/runtime-x86_64' \
            | sha256sum --check --strict
          chmod +x appimage-tools/appimagetool.AppImage appimage-tools/runtime-x86_64
          cd appimage-tools
          ./appimagetool.AppImage --appimage-extract >/dev/null
          VERSION="${{ inputs.version }}" ARCH=x86_64 ./squashfs-root/AppRun \
            --runtime-file "$PWD/runtime-x86_64" \
            "$GITHUB_WORKSPACE/mamir/release-stage/MAMIR-Installer.AppDir" \
            "$GITHUB_WORKSPACE/mamir/release-assets/MAMIR-Installer-Linux-x86_64.AppImage"
          chmod +x "$GITHUB_WORKSPACE/mamir/release-assets/MAMIR-Installer-Linux-x86_64.AppImage"
      - name: Checksum and encrypt the private installer
        shell: bash
        working-directory: mamir
        env:
          MAMIR_ARTIFACT_PASSWORD: ${{ secrets.MAMIR_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          count="$(find release-assets -maxdepth 1 -type f \
            ! -name '*.sha256' ! -name '*.enc' -print | wc -l | tr -d ' ')"
          test "$count" -eq 1
          asset="$(find release-assets -maxdepth 1 -type f \
            ! -name '*.sha256' ! -name '*.enc' -print)"
          sha256sum "$asset" | sed 's#  .*/#  #' >"${asset}.sha256"
          for input in "$asset" "${asset}.sha256"; do
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
              -pass env:MAMIR_ARTIFACT_PASSWORD -in "$input" -out "${input}.enc"
          done
      - name: Transfer encrypted outputs only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mamir-${{ inputs.version }}-${{ matrix.platform }}-encrypted
          path: mamir/release-assets/*.enc
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
